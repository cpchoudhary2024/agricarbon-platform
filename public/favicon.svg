<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Ground Truth.

    The mark is a soil profile in section, filled about two-thirds — which is the argument of the
    whole site in one glyph: soil is a container with a finite capacity, and the only question that
    matters is how much room is left in yours.

    The line at the top is the ground surface. The pale band beneath it is headroom — the space a
    carbon contract is really selling you. The solid bands below are carbon already held.
  -->
  <rect width="32" height="32" rx="7" fill="#14532D"/>

  <!-- ground surface -->
  <rect x="6" y="7.5" width="20" height="1.6" rx="0.8" fill="#FAFAF9"/>

  <!-- headroom: the capacity still unfilled -->
  <rect x="6" y="12" width="20" height="4.2" rx="1.2" fill="#FAFAF9" opacity="0.26"/>

  <!-- carbon already held -->
  <rect x="6" y="17.6" width="20" height="3.6" rx="1.2" fill="#4ADE80"/>
  <rect x="6" y="22.6" width="20" height="3.6" rx="1.2" fill="#22C55E"/>
</svg>
